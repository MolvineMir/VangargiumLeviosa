<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations! 🎉</title>
    <style>
        /* Base reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Body Styling */
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #282c34;
            color: #f8f8f8;
            overflow: hidden;
            text-align: center;
        }

        /* Container for Animation Effects */
        .container {
            position: relative;
            max-width: 800px;
            padding: 20px;
        }

        /* Congratulations Header */
        h1 {
            font-size: 3em;
            animation: slideDown 1.5s ease forwards;
            opacity: 0;
        }

        @keyframes slideDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Subtitle */
        .subtitle {
            font-size: 1.2em;
            margin: 20px 0;
            opacity: 0;
            animation: fadeIn 2s ease forwards;
            animation-delay: 0.5s;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Floating Confetti */
        .confetti {
            position: absolute;
            width: 15px;
            height: 15px;
            background: var(--color);
            opacity: 0.8;
            top: -50px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }

        /* Button Styling */
        .cta-button {
            background-color: #61dafb;
            color: #282c34;
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.3s;
            animation: fadeIn 2s ease forwards;
            animation-delay: 1s;
        }

        .cta-button:hover {
            transform: scale(1.1);
            background-color: #21a1f1;
        }

        /* Form Styling */
        .form-container {
            margin-top: 30px;
            opacity: 0;
            animation: fadeIn 2s ease forwards;
            animation-delay: 1.5s;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: #61dafb;
            outline: none;
        }

        button.submit-button {
            background-color: #61dafb;
            color: #282c34;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }

        button.submit-button:hover {
            background-color: #21a1f1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Congratulations! 🎉</h1>
        <p class="subtitle">You’ve completed the experience! Thank you for exploring our research.</p>
        
        <!-- Call-to-action Button -->
        <button class="cta-button" onclick="showForm()">Share Your Thoughts</button>

        <!-- Form Container -->
        <div class="form-container" id="form-container" style="display: none;">
            <form action="submit_form.html" method="post">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="feedback" rows="5" placeholder="Share your experience with us..."></textarea>
                <button type="submit" class="submit-button">Submit</button>
            </form>
        </div>
    </div>

    <!-- Confetti Animation Script -->
    <script>
        const confettiColors = ['#fcd34d', '#60a5fa', '#a78bfa', '#f87171', '#34d399'];
        
        // Create confetti elements and animate them
        function createConfetti() {
            for (let i = 0; i < 150; i++) {
                let confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                confetti.style.setProperty('--color', confettiColors[Math.floor(Math.random() * confettiColors.length)]);
                document.body.appendChild(confetti);
            }
        }

        // Show form when CTA button is clicked
        function showForm() {
            document.getElementById('form-container').style.display = 'block';
        }

        // Run confetti creation on page load
        createConfetti();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True or False Quiz</title>
    <style>
        body, html { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: Arial, sans-serif; background-color: #e0f7fa; }
        .container { text-align: center; width: 80%; max-width: 600px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>True or False Quiz</h1>
        <div id="question-container"></div>
        <button onclick="nextQuestion()">Next Question</button>
    </div>
    <script>
        const questions = [
            { question: "China has over 1 billion people.", answer: true },
            { question: "Russia’s political power is distributed equally.", answer: false },
            { question: "Vocational education modernisation is more dynamic in China than in Russia.", answer: true }
        ];
        let index = 0;
        
        function displayQuestion() {
            document.getElementById("question-container").innerHTML = `
                <p>${questions[index].question}</p>
                <button onclick="checkAnswer(true)">True</button>
                <button onclick="checkAnswer(false)">False</button>
            `;
        }

        function checkAnswer(answer) {
            const result = answer === questions[index].answer ? "Correct!" : "Wrong!";
            alert(result);
            nextQuestion();
        }

        function nextQuestion() {
            index++;
            if (index < questions.length) displayQuestion();
            else window.location.href = "../page3/index.html";
        }

        displayQuestion();
    </script>
</body>
</html>
